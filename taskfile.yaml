# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev

version: "3"

vars:
  BUILD_DIR_NAME: >-
    build
  OUTPUT_EXE_PATH: >-
    target/debug/aw_models.dll

tasks:
  default:
    cmds:
      - task: build

  clean:
    silent: true
    cmds:
      - cmd: git add .
        ignore_error: true
      - task: git-clean

  git-clean:
    vars:
      CLOSE_STDIN: '{{if eq OS "windows"}}<nul{{else}}0<&-{{end}}'
    cmds:
      - cmd: git add .
      - cmd: git clean -xfd {{.CLOSE_STDIN}}
        silent: true
        ignore_error: true

  rebuild:
    cmds:
      - task: clean
      - task: build

  run:
    deps: [cmake-install]
    cmds:
      - cmd: >-
          cmd.exe /D /E:ON /C \
            start "taskfile-run" /D "{{joinPath .TASKFILE_DIR "bin"}}" "{{joinPath .TASKFILE_DIR .OUTPUT_EXE_PATH}}"

  build:
    cmds:
      - task: build-cargo
      - task: build-python
        
  build-python:
    deps: [git-submodule-init]
    aliases: [py-build, pyb, build-py]
    silent: true
    sources:
      - aw-*/**/pyproject.toml
      - aw-*/**/requirements*.lock
      - aw-*/**/*.py
    cmds:
      - cmd: rye sync
      - cmd: rye build

  build-cargo:
    deps: [git-submodule-init]
    aliases: [rust-build, build-rs, cargo-bld]
    silent: true
    sources:
      - aw-*/**/*.rs
      - aw-*/**/Cargo.toml
      - aw-*/**/Cargo.lock
    cmds:
      - cmd: rustup upgrade
        ignore_error: true
      - cmd: cargo build
        
  deps-windows:
    status:
      - git --version
      - make --version
      - python --version
      - poetry --version
      - node --version
      - npm --version
      - rustc --version
      - cargo --version
      - 7z
    cmds:
      - cmd: |
          scoop install \
            extras/inno-setup \
            main/7zip \
            main/uutils-coreutils

  git-submodule-init: 
    sources:
      - .gitmodules
    status:
      - test -f "{{joinPath .TASKFILE_DIR "aw-qt" "Makefile"}}"
    cmds:
      - cmd: |
          if [ -f "{{joinPath .TASKFILE_DIR ".gitmodules"}}" ]; then
            git -C "{{.TASKFILE_DIR}}" submodule update --init --recursive
          fi

  clang-format:
    aliases: [fmt, format]
    sources:
      - src/**/*.c
      - src/**/*.h
    cmds:
      - for: sources
        cmd: |
          clang-format -i "{{joinPath .TASKFILE_DIR .ITEM}}"

  tidy:
    sources:
      - src/**/*.c
      - src/**/*.h
    cmds:
      - for: sources
        task: clang-tidy
        vars: { CLANG_TIDY_SOURCE: "{{.ITEM}}" }

  clang-tidy:
    requires:
      vars: [CLANG_TIDY_SOURCE]
    vars:
      CLANG_TIDY_OUT_FILE: '.build/{{splitList "/" (toSlash .CLANG_TIDY_SOURCE) | last}}.out'
    sources:
      - "{{.CLANG_TIDY_SOURCE}}"
    generates:
      - "{{.CLANG_TIDY_OUT_FILE}}"
    cmds:
      - cmd: mkdir "{{joinPath .TASKFILE_DIR ".build"}}"
        silent: true
        ignore_error: true
      - cmd: |
          clang-tidy "{{joinPath .TASKFILE_DIR .CLANG_TIDY_SOURCE}}" \
            --config-file="{{joinPath .TASKFILE_DIR ".clang-tidy"}}" \
            --use-color \
            --fix \
            --fix-notes \
            --fix-errors \
          > "{{joinPath .TASKFILE_DIR .CLANG_TIDY_OUT_FILE | fromSlash}}"
