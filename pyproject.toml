[project]
name = "activitywatch"
version = "0.13.2"
description = "The free and open-source automated time tracker. Cross-platform, extensible, privacy-focused."
authors = [
    { name = "Erik Bjäreholt", email = "erik@bjareho.lt" },
    { name = "Johan Bjäreholt", email = "johan@bjareho.lt" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aw-core",
    "aw-client",
    "aw-server",
    "aw-qt",
]

[tool.uv]
package = true
managed = true
link-mode = "copy"

[tool.uv.workspace]
members = [
    "aw-core",
    "aw-client",
    "aw-server",
    "aw-qt",
]

[tool.uv.sources]
aw-client = { workspace = true }
aw-core = { workspace = true }
aw-server = { workspace = true }
aw-qt = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "psutil>=6.1.1",
    "pytest>=8.3.4",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
]
