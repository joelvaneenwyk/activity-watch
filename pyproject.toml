[project]
name = "activitywatch"
version = "0.13.2"
description = "The free and open-source automated time tracker. Cross-platform, extensible, privacy-focused."
authors = [
    { name = "Erik Bjäreholt", email = "erik@bjareho.lt" },
    { name = "Johan Bjäreholt", email = "johan@bjareho.lt" },
]
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    # https://github.com/ionrock/cachecontrol/issues/292
    "urllib3<2",
]

[tool.uv]
managed = true
package = true

[tool.uv.workspace]
members = [
    #"aw-core",
    #"aw-client",
    #"aw-watcher-afk",
    #"aw-watcher-window",
    #"aw-server",
    #"aw-qt",
]

[tool.uv.pip]
universal = true

[tool.uv.sources]
# releases are very infrequent, so good idea to use the master branch
# we need this unreleased commit: https://github.com/pyinstaller/pyinstaller-hooks-contrib/commit/0f40dc6e74086e5472aee75070b9077b4c17ab18
pyinstaller-hooks-contrib = { git = "https://github.com/pyinstaller/pyinstaller-hooks-contrib.git", branch = "master" }

[build-system]
requires = [
    "hatchling",
    # Won't be respected due to https://github.com/python-poetry/poetry/issues/1584
    # needed due to https://github.com/pypa/setuptools/issues/1963
    "setuptools>=49.1.1",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "psutil>=6.0.0",
    "pywin32-ctypes>=0.2.2",
    "pefile>=2023.2.7",
    "pyinstaller>=6.10.0",
    "poetry>=1.8.3",
    "setuptools>49.1.1",
    "flask-restx>=1.3.0",
    "tomli>=2.0.1",
    "pip>=24.2",
    "pyinstaller-hooks-contrib",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "aw-client",
    "aw-core",
    "aw-notify",
    "aw-qt",
    "aw-server",
    "aw-watcher-afk",
    "aw-watcher-input",
    "aw-watcher-window",
]

[tool.hatch.build.targets.sdist]
exclude = [".git", ".task", ".venv", "dist", "target"]
